name: Python 3.13 deployment compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install video system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - name: Install wheel-only Python dependencies
        run: python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Verify dependencies and video workflows
        run: |
          python -m pip check
          python -m pytest -q
